<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>SJD 앱 다운로드</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f1f5f9;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:28px 18px 56px}
  .hero{background:#fff;border-radius:24px;padding:28px;box-shadow:0 12px 40px rgba(15,23,42,.08);text-align:center}
  .logo{width:72px;height:72px;border-radius:20px;margin:0 auto 16px;display:grid;place-items:center;background:#0f172a;color:#fff;font-size:30px;font-weight:800}
  h1{margin:0;font-size:30px}
  .sub{margin:10px 0 0;color:#64748b;line-height:1.6}
  .device{display:inline-block;margin-top:16px;padding:7px 12px;border-radius:999px;background:#e2e8f0;font-size:13px;font-weight:700}
  .card{margin-top:18px;background:#fff;border-radius:20px;padding:22px;box-shadow:0 8px 24px rgba(15,23,42,.06)}
  .card h2{margin:0 0 8px;font-size:21px}
  .meta{font-size:14px;color:#64748b;margin-bottom:16px}
  .btn{display:block;width:100%;padding:16px 18px;border-radius:14px;text-align:center;text-decoration:none;font-weight:800;font-size:17px;background:#2563eb;color:#fff}
  .btn.android{background:#059669}
  .btn.disabled{background:#cbd5e1;color:#64748b;pointer-events:none}
  .note{margin-top:13px;font-size:13px;color:#64748b;line-height:1.6}
  .warn{padding:12px;border-radius:12px;background:#fff7ed;color:#9a3412;font-size:13px;margin-top:12px}
  .hidden{display:none}
  footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="logo">S</div>
    <h1>SJD 앱 다운로드</h1>
    <p class="sub">현재 휴대폰을 자동으로 확인하여 설치 버튼을 표시합니다.</p>
    <span class="device" id="device">기기 확인 중...</span>
  </section>

  <section class="card" id="iosCard">
    <h2>iPhone / iPad</h2>
    <div class="meta" id="iosVersion">iOS 버전 확인 중...</div>
    <a class="btn disabled" id="iosBtn" href="#">iPhone 앱 준비 중</a>
    <div class="note">Apple Developer에 등록된 iPhone만 Ad Hoc 앱을 설치할 수 있습니다.</div>
  </section>

  <section class="card" id="androidCard">
    <h2>Android</h2>
    <div class="meta">APK 직접 설치</div>
    <a class="btn android disabled" id="androidBtn" href="#">Android 앱 준비 중</a>
    <div class="note">APK가 등록되면 이 버튼에서 바로 다운로드할 수 있습니다.</div>
  </section>

  <footer>SJD · GitHub Pages HTTPS App Center</footer>
</div>

<script>
(function(){
  const ua = navigator.userAgent || "";
  const isIOS = /iPhone|iPad|iPod/i.test(ua);
  const isAndroid = /Android/i.test(ua);
  document.getElementById("device").textContent =
    isIOS ? "현재 기기: iPhone / iPad" :
    isAndroid ? "현재 기기: Android" : "현재 기기: PC / 기타";

  if (isIOS) document.getElementById("androidCard").classList.add("hidden");
  if (isAndroid) document.getElementById("iosCard").classList.add("hidden");

  fetch("./version.json", {cache:"no-store"})
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(v => {
      if (v.ios && v.ios.version) {
        document.getElementById("iosVersion").textContent =
          "버전 " + v.ios.version + " · Build " + (v.ios.build || "-");
        const btn = document.getElementById("iosBtn");
        const manifest = location.origin + location.pathname.replace(/\/?$/, "/") + "manifest.plist";
        btn.href = "itms-services://?action=download-manifest&url=" + encodeURIComponent(manifest);
        btn.textContent = "SJD iPhone 앱 설치";
        btn.classList.remove("disabled");
      }
    })
    .catch(() => {
      document.getElementById("iosVersion").textContent = "아직 iOS 앱이 배포되지 않았습니다.";
    });

  fetch("./SJD.apk", {method:"HEAD", cache:"no-store"})
    .then(r => {
      if (r.ok) {
        const btn = document.getElementById("androidBtn");
        btn.href = "./SJD.apk";
        btn.textContent = "SJD Android 앱 설치";
        btn.classList.remove("disabled");
      }
    })
    .catch(() => {});
})();
</script>
</body>
</html>
